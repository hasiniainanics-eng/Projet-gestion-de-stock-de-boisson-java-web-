<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Stock de Boisson</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Barre latérale -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-wine-glass-alt"></i>
                <h2>Gestion de stock de boisson</h2>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-chart-line"></i> Statistiques</li>
                    <li><i class="fas fa-box"></i> Produits</li>
                    <li><i class="fas fa-cog"></i> Paramètres</li>
                    <li><i class="fas fa-question-circle"></i> Aide</li>
                </ul>
            </nav>
            <div class="logout">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </div>
        </aside>

        <!-- Contenu principal -->
        <main class="main-content">
            <header>
                <h1>Bonjour, Admin</h1>
                <div class="header-actions">
                    <button class="btn-add">+ Ajouter</button>
                    <i class="far fa-bell notification-icon"></i>
                </div>
            </header>

            <!-- Cartes de statistiques -->
            <section class="stats-cards">
                <div class="card border-red">
                    <p>Alerte ruptures</p>
                    <span class="value">3</span>
                </div>
                <div class="card border-yellow">
                    <p>Proche expiration</p>
                    <span class="value">6</span>
                </div>
                <div class="card border-purple">
                    <p>Valeur du Stock</p>
                    <span class="value">200 000 Ar</span>
                </div>
            </section>

            <!-- Section Graphique -->
            <section class="chart-section">
                <div class="chart-header">
                    <h3>Mercredi 13, Mai 2026</h3>
                    <div class="legend">
                        <span class="leg-item"><span class="dot purple"></span> Quantité en stock</span>
                        <span class="leg-item"><span class="dot white"></span> Vente</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="myChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <!-- Script pour le graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
